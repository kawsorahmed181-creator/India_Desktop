name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies (Capacitor is installed here even if package.json lacks it)
        run: |
          npm install
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/preferences@6

      - name: Build the web app
        run: npx vite build --base=./

      - name: Create Capacitor config if it is missing
        run: |
          [ -f capacitor.config.json ] || echo '{"appId":"com.india2027.squadlab","appName":"India 2027 Squad Lab","webDir":"dist"}' > capacitor.config.json

      - name: Create the Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build the debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: india-2027-squad-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
